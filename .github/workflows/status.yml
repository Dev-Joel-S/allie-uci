name: UCI status regression
on: [push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess
      - run: python -m py_compile engine.py
      - run: python engine.py --unit
