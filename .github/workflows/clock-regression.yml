name: Clock regression
on: [push]
permissions:
  contents: read
jobs:
  clocks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess
      - name: Prepare exact released GUI source
        run: |
          mkdir -p gui-check/src-tauri/src
          curl -fL https://raw.githubusercontent.com/franciscoBSalgueiro/en-croissant/v0.15.1/src-tauri/src/game.rs -o gui-check/src-tauri/src/game.rs
          git apply --check --directory=gui-check ideas/en-croissant-clock.patch
      - name: Prepare regression harness
        run: |
          cat > clock_check.py <<'PY'
          import ast, pathlib, textwrap, urllib.request, os
          root=pathlib.Path("work-clock"); (root/"src").mkdir(parents=True,exist_ok=True)
          source=pathlib.Path(os.environ["GUI_SOURCE"]).read_text() if "GUI_SOURCE" in os.environ else urllib.request.urlopen("https://raw.githubusercontent.com/franciscoBSalgueiro/en-croissant/v0.15.1/src-tauri/src/game.rs").read().decode()
          def method(name):
              marker="    fn "+name+"("
              start=source.index(marker)
              end=source.find("\n    fn ",start+len(marker))
              if end<0: end=source.index("\n}\n\npub struct GameManager",start)
              return source[start:end]
          definitions="""use std::{collections::HashMap, time::Instant, sync::Arc};
          use shakmaty::{Chess, Position, Color, EnPassantMode, san::SanPlus, fen::Fen, uci::UciMove};
          use tokio::sync::{RwLock, Mutex, oneshot};
          use dashmap::DashMap;
          use tokio::time::{sleep, Duration};
          type Error = Box<dyn std::error::Error + Send + Sync>;
          #[derive(Clone,Debug,PartialEq)]
          enum GameEndReason { Checkmate, Timeout }
          #[derive(Clone,Debug,PartialEq)]
          enum DrawReason { Stalemate, InsufficientMaterial, ThreefoldRepetition, FiftyMoveRule }
          #[derive(Clone,Debug,PartialEq)]
          enum GameResult { WhiteWins { reason: GameEndReason }, BlackWins { reason: GameEndReason }, Draw { reason: DrawReason } }
          #[derive(Clone,Debug,PartialEq)]
          enum GameStatus { Playing, Finished { result: GameResult } }
          #[derive(Clone,Debug)]
          struct GameMove { uci:String, san:String, fen_after:String, clock:Option<u64>,white_time:Option<u64>,black_time:Option<u64> }
          struct ClockState { white_time:Option<u64>,black_time:Option<u64>,white_increment:u64,black_increment:u64,last_tick:Instant }
          struct GameController { position:Chess, position_history:HashMap<String,u32>,status:GameStatus,clock:Option<ClockState>,moves:Vec<GameMove>,white_engine:Option<Arc<Mutex<FakeEngine>>>,black_engine:Option<Arc<Mutex<FakeEngine>>> }
          #[derive(Clone,Debug)]
          struct EngineLog;
          struct FakeEngine;
          impl FakeEngine { fn get_logs(&self)->Vec<EngineLog> { Vec::new() } }
          struct GameManager { games:DashMap<String,Arc<RwLock<GameController>>> }
          impl Error { }
          """
          definitions=definitions.replace("impl Error { }\n","")
          # The only application-specific error in the copied methods.
          definitions=definitions.replace("type Error = Box<dyn std::error::Error + Send + Sync>;","")
          definitions+="""#[derive(Debug)]
          enum Error { GameNotInProgress, InvalidMove, GameNotFound(String), InvalidColor(String) }
          impl From<shakmaty::uci::ParseUciMoveError> for Error { fn from(_:shakmaty::uci::ParseUciMoveError)->Self { Self::InvalidMove } }
          impl From<shakmaty::uci::IllegalUciMoveError> for Error { fn from(_:shakmaty::uci::IllegalUciMoveError)->Self { Self::InvalidMove } }
          """
          methods="\n".join(method(n) for n in ["position_key","apply_move","check_game_end","get_current_times"])
          log_start=source.index("    pub async fn get_engine_logs(")
          log_end=source.index("\n}\n\nimpl Default for GameManager",log_start)
          log_method=source[log_start:log_end]
          tests=r"""
          #[tokio::test]
          async fn delayed_black_bestmove_keeps_white_clock_frozen() {
              let mut ctrl = GameController { position:Chess::default(),position_history:HashMap::new(),
                status:GameStatus::Playing,moves:Vec::new(),white_engine:None,black_engine:None,
                clock:Some(ClockState {white_time:Some(1_800_000),black_time:Some(1_800_000),
                  white_increment:2_000,black_increment:5_000,last_tick:Instant::now()}) };
              for mv in ["g1f3","d7d5","f3h4","e7e5","h4f5","b7b6","f5g3"] {
                  ctrl.apply_move(mv).unwrap();
              }
              assert_eq!(ctrl.moves.last().unwrap().san,"Ng3");
              assert_eq!(ctrl.position.turn(),Color::Black);
              let (white, black_start)=ctrl.get_current_times();
              let ctrl=Arc::new(RwLock::new(ctrl));
              let (tx,rx)=oneshot::channel::<()>();
              let engine_ctrl=ctrl.clone();
              let fake_engine=tokio::spawn(async move {
                  // Delay until the test has observed the clocks while bestmove is pending.
                  rx.await.unwrap();
                  engine_ctrl.write().await.apply_move("g8f6").unwrap();
              });
              sleep(Duration::from_millis(120)).await;
              let black_after;
              {
                let reading=tokio::time::timeout(Duration::from_millis(100),ctrl.read()).await.unwrap();
                let (wt,bt)=reading.get_current_times();
                assert_eq!(wt,white,"White clock ran during black search");
                black_after=bt.unwrap();
                assert!(black_start.unwrap()-black_after>=100,"Black clock did not run");
                assert_eq!(reading.position.turn(),Color::Black);
              }
              tx.send(()).unwrap();
              fake_engine.await.unwrap();
              let black_fixed=ctrl.read().await.get_current_times().1;
              assert!(black_fixed.unwrap()>=black_after+4_900,"Black increment missing");
              let white_start=ctrl.read().await.get_current_times().0.unwrap();
              sleep(Duration::from_millis(120)).await;
              let reading=ctrl.read().await;
              let (wt,bt)=reading.get_current_times();
              assert_eq!(reading.position.turn(),Color::White);
              assert_eq!(bt,black_fixed,"Black clock ran after bestmove");
              assert!(white_start-wt.unwrap()>=100,"White clock did not restart");
          }
          
          #[tokio::test]
          async fn logs_must_not_block_clocks_while_engine_is_delayed() {
              let engine=Arc::new(Mutex::new(FakeEngine));
              let held=engine.clone().lock_owned().await;
              let ctrl=Arc::new(RwLock::new(GameController {position:Chess::default(),
                  position_history:HashMap::new(),status:GameStatus::Playing,moves:Vec::new(),
                  clock:None,white_engine:None,black_engine:Some(engine)}));
              let mgr=Arc::new(GameManager {games:DashMap::new()});
              mgr.games.insert("test".to_owned(),ctrl.clone());
              let logger=tokio::spawn({
                let mgr=mgr.clone();
                async move { mgr.get_engine_logs("test","black").await.unwrap() }
              });
              sleep(Duration::from_millis(50)).await;
              let result=tokio::time::timeout(Duration::from_millis(100),ctrl.write()).await;
              if std::env::var("EXPECT_CLOCK_BLOCK").is_ok() {
                  assert!(result.is_err(),"Original GUI no longer reproduces lock bug");
                  println!("REPRODUCED: log request blocks clock writes while bestmove is pending");
              } else {
                  assert!(result.is_ok(),"Clock blocked while delayed engine holds its lock");
                  println!("PASS: clock writes remain responsive during delayed engine and log request");
              }
              drop(result);
              drop(held);
              logger.await.unwrap();
          }
          
          """
          (root/"src/lib.rs").write_text(definitions+"\nimpl GameController {\n"+methods+"\n}\nimpl GameManager {\n"+log_method+"\n}\n"+tests)
          (root/"Cargo.toml").write_text('[package]\nname="clock-regression"\nversion="0.1.0"\nedition="2021"\n[dependencies]\nshakmaty="=0.27.3"\ndashmap="6"\ntokio={version="1",features=["full"]}\n')
          # Execute the actual adapter's clock-selection statements, not a reimplementation.
          import chess, types, time
          module=ast.parse(pathlib.Path("engine.py").read_text())
          adapter=next(n for n in module.body if isinstance(n,ast.ClassDef) and n.name=="Adapter")
          search=next(n for n in adapter.body if isinstance(n,ast.FunctionDef) and n.name=="search")
          block=[]
          for stmt in search.body:
              if isinstance(stmt,ast.ImportFrom) or isinstance(stmt,ast.Import): continue
              if isinstance(stmt,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="inc" for t in stmt.targets): break
              block.append(stmt)
          board=chess.Board()
          for mv in ["g1f3","d7d5","f3h4","e7e5","h4f5","b7b6","f5g3"]: board.push_uci(mv)
          assert board.turn==chess.BLACK
          namespace=dict(self=types.SimpleNamespace(board=board),
           values=dict(wtime=1_700_000,btime=1_800_000,winc=2_000,binc=5_000),
           flags=set(),OPTIONS=dict(moveoverhead=[100]),chess=chess,time=time)
          exec(compile(ast.fix_missing_locations(ast.Module(body=block,type_ignores=[])),"engine.py","exec"),namespace)
          assert namespace["side"]==1
          assert namespace["clocks"]==[1700.,1800.]
          assert namespace["incs"]==[2.,5.]
          assert namespace["clock"]==1800.
          assert namespace["allowed"]==1799.9
          print("PASS: actual Allie clock selection after Ng3 and asymmetric UCI increments")
          
          PY
          GUI_SOURCE=gui-check/src-tauri/src/game.rs python clock_check.py
      - name: Reproduce original log and clock lock bug
        run: EXPECT_CLOCK_BLOCK=1 cargo test --manifest-path work-clock/Cargo.toml -- --nocapture
      - name: Apply targeted GUI patch
        run: |
          git apply --directory=gui-check ideas/en-croissant-clock.patch
          GUI_SOURCE=gui-check/src-tauri/src/game.rs python clock_check.py
      - name: Verify clocks during delayed bestmove after patch
        run: cargo test --manifest-path work-clock/Cargo.toml -- --nocapture

  nix-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/d261affe5e054396f3bf4ec799f304827b7f8b85.tar.gz
      - name: Evaluate patched Nix package (no full GUI build)
        run: |
          nix-instantiate --parse ideas/en-croissant-patched.nix > /dev/null
          nix-instantiate ideas/en-croissant-patched.nix
          nix-instantiate --eval --strict --expr 'let p = import ./ideas/en-croissant-patched.nix {}; in assert p.version == "0.15.1"; builtins.map builtins.toString p.patches'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess
      - name: Replay user's actual Ng3 log
        run: |
          python - <<'PY'
          import pathlib, re, chess
          lines=pathlib.Path("ideas/logs.txt").read_text().splitlines()
          found=False
          for i,line in enumerate(lines):
              if not line.startswith("gui, position "): continue
              fen,moves=line.removeprefix("gui, position fen ").split(" moves ")
              board=chess.Board(fen)
              last_san=None
              for move in moves.split():
                  m=chess.Move.from_uci(move)
                  assert m in board.legal_moves
                  last_san=board.san(m)
                  board.push(m)
              assert board.turn == chess.BLACK
              if board.ply() != 19 or last_san != "Ng3": continue
              assert lines[i+1] == "gui, go wtime 1641918 btime 1769767 winc 2000 binc 2000"
              assert lines[i+2] == "engine, info nodes 4096 time 190305 pv g7g6"
              assert "engine, bestmove g7g6" in lines[i+3:i+5]
              next_go=next(l for l in lines[i+2:] if l.startswith("gui, go "))
              next_black=int(re.search(r"btime (\d+)",next_go).group(1))
              assert abs((1769767-next_black)-(190305-2000)) <= 5
              found=True
          assert found
          assert "engine, option name UCI_Elo type spin default 1500 min 800 max 2600" in lines
          assert not any(l.startswith("gui, setoption name UCI_Elo ") for l in lines)
          print("PASS: all logged positions legal and black to move; real Ng3 search charged to black within 1 ms; no Elo override sent")
          PY
