name: INT8 cache regression
on: [push]
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install chess safetensors numpy
          git init upstream
          git -C upstream remote add origin https://github.com/y0mingzhang/allie.git
          git -C upstream fetch --depth 1 origin 0aace9abefbd75a24e3a1fd37e9dd1d3f992435b
          git -C upstream checkout --detach FETCH_HEAD
      - name: Syntax and existing regressions
        run: |
          python -m py_compile engine.py
          python engine.py --unit
      - name: Actual upstream quantizer and cache regression
        run: |
          PYTHONPATH="$PWD/upstream/src" python - <<'PY'
          import tempfile
          from pathlib import Path
          import torch
          from safetensors.torch import save_file
          import engine
          import allie.lichess.model as M
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              model_dir = root / "model"
              model_dir.mkdir()
              (model_dir / "config.json").write_text("{}")
              weights = {"0.qkv": torch.randn(4, 8).bfloat16(),
                         "scalars": torch.randn(3).float()}
              save_file(weights, model_dir / "model.safetensors")
              real_quantize, real_model = M.quantize, M.Model
              calls = []
              def counted(value):
                  calls.append(1)
                  return real_quantize(value)
              class TinyModel:
                  def __init__(self, path, **kwargs):
                      self.w, self.scales = {}, {}
                      for name, value in M.read(path / "model.safetensors"):
                          if name.split(".")[-1] in M.MATRICES:
                              self.w[name], self.scales[name] = M.quantize(value)
                          else:
                              self.w[name] = value
              M.quantize, M.Model = counted, TinyModel
              original_read = M.read
              def load():
                  return engine.load_int8_model(M, model_dir, root / "cache", torch, int8=True)
              cold = load()
              assert len(calls) == 1
              warm = load()
              assert len(calls) == 1, "Warm load requantized weights"
              for name in cold.w:
                  assert torch.equal(cold.w[name], warm.w[name]), name
              assert torch.equal(cold.scales["0.qkv"], warm.scales["0.qkv"])
              assert M.read is original_read and M.quantize is counted
              cache = next((root / "cache").glob("*.pt"))
              cache.write_bytes(b"corrupt cache")
              recovered = load()
              assert len(calls) == 2
              assert torch.equal(cold.w["0.qkv"], recovered.w["0.qkv"])
              (model_dir / "config.json").write_text('{"changed": true}')
              load()
              assert len(calls) == 3, "Changed model reused stale cache"
              (model_dir / "config.json").write_text('{"fail": true}')
              class FailModel:
                  def __init__(self, *args, **kwargs):
                      raise RuntimeError("synthetic model failure")
              M.Model = FailModel
              try:
                  load()
              except RuntimeError as exc:
                  assert str(exc) == "synthetic model failure"
              else:
                  raise AssertionError("Model error swallowed")
              assert M.read is original_read and M.quantize is counted
              assert not list((root / "cache").glob("*.tmp"))
              M.Model, M.quantize = real_model, real_quantize
          print("PASS: cold/warm cache, identical tensors, no repeated quantization, corruption recovery, invalidation, hook restoration")
          PY
