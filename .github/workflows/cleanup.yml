name: Process cleanup regression
on: [push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess
      - run: python -m py_compile engine.py
      - run: python engine.py --unit
      - name: Verify graceful cleanup and parent death
        shell: bash
        run: |
          python - <<'PY'
          import io, os, signal, subprocess, sys, tempfile, time
          from pathlib import Path
          import engine
          p = subprocess.Popen([sys.executable, "-c", "import time; time.sleep(60)"])
          engine.stop_process(p)
          assert p.poll() is not None
          for sig in (signal.SIGTERM, signal.SIGKILL, signal.SIGHUP):
              with tempfile.TemporaryDirectory() as directory:
                  marker = str(Path(directory) / "child")
                  code = '''
          import os, subprocess, sys, time
          p = subprocess.Popen([sys.executable, "-c",
              "import engine; engine.exit_with_parent(); import time; time.sleep(60)"],
              env=dict(os.environ, ALLIE_TEST_PARENT=str(os.getpid())))
          open(sys.argv[1], "w").write(str(p.pid))
          time.sleep(60)
          '''
                  parent = subprocess.Popen([sys.executable, "-c", code, marker])
                  deadline = time.monotonic() + 10
                  while not Path(marker).exists():
                      assert time.monotonic() < deadline
                      time.sleep(.05)
                  child_pid = int(Path(marker).read_text())
                  time.sleep(.5)
                  parent.send_signal(sig)
                  parent.wait(timeout=3)
                  deadline = time.monotonic() + 5
                  while True:
                      stat = Path(f"/proc/{child_pid}/stat")
                      if not stat.exists() or stat.read_text().split()[2] == "Z":
                          break
                      assert time.monotonic() < deadline, f"Orphan alive: {child_pid}"
                      time.sleep(.05)
          print("PASS: process cleanup, SIGTERM, SIGKILL, SIGHUP")
          PY
